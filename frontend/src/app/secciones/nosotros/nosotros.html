<section id="nosotros" class="seccion" data-theme="light" aria-labelledby="nosotros-titulo">
  <mt-marca-agua esquina="inferior-derecha" ancho="clamp(300px, 46vw, 680px)" />

  <div class="contenedor nosotros" [class.sin-imagen]="!imagen()">
    @if (imagen(); as img) {
      <figure class="visual aparecer--izquierda" mtAparecer>
        <mt-regla class="visual__regla" orientacion="vertical" [largo]="14" />
        <div class="visual__marco">
          <img
            [src]="img.src + '-1200.webp'"
            [attr.srcset]="img.src + '-640.webp 640w, ' + img.src + '-1200.webp 1200w'"
            sizes="(min-width: 900px) 46vw, 100vw"
            [width]="img.ancho"
            [height]="img.alto"
            [alt]="img.alt"
            loading="lazy"
            decoding="async"
          />
        </div>
        <div class="visual__bloque" data-theme="dark">
          <p class="t-h3">{{ marca().concepto }}</p>
          <p class="t-pequeno visual__pilares">{{ marca().pilares.join(' + ') }}</p>
        </div>
        <figcaption class="t-micro t-secundario">Imagen ilustrativa del manual de marca.</figcaption>
      </figure>
    }

    <div class="texto aparecer--derecha" mtAparecer [retraso]="120">
      <mt-titulo-seccion idTitulo="nosotros-titulo" [titulo]="nosotros().titulo" [entradilla]="nosotros().entradilla" />
      <div class="pila-4 medida">
        @for (p of nosotros().parrafos; track $index) {
          <p>{{ p }}</p>
        }
      </div>

      <figure class="matriz">
        <img src="img/marca/logo-salazar-arias.svg" width="148" height="114" alt="Salazar Arias Company" loading="lazy" decoding="async" />
        <figcaption class="t-pequeno t-secundario">
          {{ marca().nombre }} es una marca de <strong>{{ marca().empresaMatriz }}</strong>.
        </figcaption>
      </figure>
    </div>
  </div>
</section>
